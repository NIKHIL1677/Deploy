<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="todo-container">

        <h1>My To-Do List</h1>
        <button id="darkModeBtn" class="dark-mode-btn">
    🌙 Dark Mode
</button>

        <!-- Add Task -->
        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <button id="addBtn">Add</button>

        </div>


        <!-- Count -->
        <div class="task-info">

            <span>
                Total: <b id="totalTasks">0</b>
            </span>

            <span>
                Completed: <b id="completedTasks">0</b>
            </span>

        </div>


        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search task..."
            >

        </div>


        <!-- Filter -->
        <div class="filter-buttons">

            <button onclick="filterTasks('all')">
                All
            </button>

            <button onclick="filterTasks('pending')">
                Pending
            </button>

            <button onclick="filterTasks('completed')">
                Completed
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"></ul>

    </div>


    <script src="script.js"></script>

</body>

</html>
